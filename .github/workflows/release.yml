name: release

# ElmerGrid is a single executable with no external dependencies, so a release
# is one file per platform that runs on a machine with nothing installed.
#
# Each archive is checked before it is published: the binary must run, it must
# produce a mesh, and it must not depend on anything that is not part of the
# operating system.  A dynamically linked binary that happens to work on the
# runner is exactly the artifact that fails on a user's machine, so the link
# check is a gate rather than a note.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and attach to
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            os: ubuntu-24.04
            static: true
          - target: linux-arm64
            os: ubuntu-24.04-arm
            static: true
          - target: macos-arm64
            os: macos-14
            brew: true
          - target: macos-x86_64
            os: macos-15-intel
            brew: true
          - target: windows-x86_64
            os: windows-2022
            msys2: UCRT64
            msys2-prefix: mingw-w64-ucrt-x86_64
            static: true
          - target: windows-arm64
            os: windows-11-arm
            msys2: CLANGARM64
            msys2-prefix: mingw-w64-clang-aarch64
            static: true

    steps:
      - uses: actions/checkout@v4

      - name: dependencies (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libmetis-dev

      - name: dependencies (macos)
        if: matrix.brew
        run: brew install cmake ninja metis

      - name: dependencies (msys2)
        if: matrix.msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msys2 }}
          install: >-
            ${{ matrix.msys2-prefix }}-cc
            ${{ matrix.msys2-prefix }}-cmake
            ${{ matrix.msys2-prefix }}-ninja
            ${{ matrix.msys2-prefix }}-binutils
            ${{ matrix.msys2-prefix }}-metis

      # A release binary has to run on a machine with no Metis installed, so it
      # links the static libmetis.a rather than whatever pkg-config offers.
      # FindMetis.cmake returns early when both variables are already set, so
      # naming them here is the supported way to override its search -- and
      # -static alone is NOT enough: pkg-config hands it the full path to
      # libmetis.dll.a, and a full path wins over the linker's preference, so
      # the binary comes out importing libmetis.dll while looking static.
      # The "self-contained" gate below is what caught that.
      # Neither Debian's libmetis-dev nor Homebrew's metis ships a static
      # library -- measured, this step failed on all four unix targets the
      # first time it ran, which is what it is for. So the release gets its
      # Metis from vcpkg, whose default linux and osx triplets are static.
      # vcpkg is preinstalled on the runners.
      #
      # There is some symmetry in that: vcpkg is what
      # AltElmer/ElmerGrid#1 proposed for this in 2020.
      - name: find a static Metis
        if: '!matrix.msys2'
        shell: bash
        run: |
          set -e
          echo "--- what the system packages actually ship ---"
          for d in /usr/lib /usr/local/lib /usr/lib/x86_64-linux-gnu /usr/lib/aarch64-linux-gnu \
                   "$(brew --prefix metis 2>/dev/null || echo /nonexistent)/lib"; do
            [ -d "$d" ] && ls "$d"/libmetis* 2>/dev/null || true
          done

          find_pair() {
            lib=$(find "$1" -name 'libmetis.a' 2>/dev/null | head -1)
            inc=$(find "$2" -name 'metis.h' 2>/dev/null | head -1)
            [ -n "$lib" ] && [ -n "$inc" ]
          }

          if find_pair /usr /usr; then
            :
          elif find_pair "$(brew --prefix metis 2>/dev/null || echo /nonexistent)" \
                         "$(brew --prefix metis 2>/dev/null || echo /nonexistent)"; then
            :
          else
            echo "--- no static Metis from the system; building one with vcpkg ---"
            vcpkg="${VCPKG_INSTALLATION_ROOT:-/usr/local/share/vcpkg}"
            [ -x "$vcpkg/vcpkg" ] || { echo "::error::vcpkg not found at $vcpkg"; exit 1; }
            "$vcpkg/vcpkg" install metis
            find_pair "$vcpkg/installed" "$vcpkg/installed" || {
              echo "::error::vcpkg reported success but produced no libmetis.a and metis.h"
              find "$vcpkg/installed" -name 'libmetis*' -o -name 'metis.h' | head -20
              exit 1
            }
          fi

          echo "METIS_A=$lib" >> "$GITHUB_ENV"
          echo "METIS_H=$(dirname "$inc")" >> "$GITHUB_ENV"
          echo "static metis: $lib"
          echo "metis header: $inc"

      - name: find a static Metis (msys2)
        if: matrix.msys2
        shell: msys2 {0}
        run: |
          set -e
          lib=$(find "$MINGW_PREFIX/lib" -maxdepth 2 -name 'libmetis.a' 2>/dev/null | head -1)
          inc=$(find "$MINGW_PREFIX/include" -maxdepth 2 -name 'metis.h' 2>/dev/null | head -1)
          if [ -z "$lib" ] || [ -z "$inc" ]; then
            echo "::error::no static libmetis.a under $MINGW_PREFIX; a release binary would depend on a shared Metis"
            exit 1
          fi
          echo "METIS_A=$lib" >> "$GITHUB_ENV"
          echo "METIS_H=$(dirname "$inc")" >> "$GITHUB_ENV"
          echo "static metis: $lib"

      - name: build and test
        if: '!matrix.msys2'
        shell: bash
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DMetis_LIBRARIES="$METIS_A" -DMetis_INCLUDE_DIR="$METIS_H" \
            ${{ matrix.static && '-DCMAKE_EXE_LINKER_FLAGS=-static' || '' }}
          cmake --build build
          ctest --test-dir build --output-on-failure

      - name: build and test (msys2)
        if: matrix.msys2
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DMetis_LIBRARIES="$METIS_A" -DMetis_INCLUDE_DIR="$METIS_H" \
            -DCMAKE_EXE_LINKER_FLAGS=-static
          cmake --build build
          ctest --test-dir build --output-on-failure

      - name: the binary must be self-contained (unix)
        if: '!matrix.msys2'
        shell: bash
        run: |
          set -e
          eg=$(find build -name 'ElmerGrid' -o -name 'ElmerGrid.exe' | head -1)
          [ -n "$eg" ] || { echo "::error::ElmerGrid was not built"; exit 1; }
          echo "binary: $eg  ($(wc -c < "$eg") bytes)"

          if [ "${{ runner.os }}" = "Linux" ]; then
            # ldd exits 1 saying "not a dynamic executable" for a static one,
            # so its output is what is read, not its status.
            out=$(ldd "$eg" 2>&1 || true)
            echo "$out"
            case "$out" in
              *"not a dynamic executable"*|*"statically linked"*) echo "ok: static" ;;
              *) echo "::error::the binary is dynamically linked"; exit 1 ;;
            esac
          else
            # A fully static binary is not supported on macOS: there is no
            # static libSystem. Self-contained here means nothing outside the
            # OS, which is what a machine without Homebrew provides.
            out=$(otool -L "$eg")
            echo "$out"
            if echo "$out" | tail -n +2 | grep -vqE '/usr/lib/|/System/'; then
              echo "::error::the binary links something outside the operating system"
              echo "$out" | tail -n +2 | grep -vE '/usr/lib/|/System/'
              exit 1
            fi
            echo "ok: nothing outside /usr/lib and /System"
          fi

      # This runs in the MSYS2 shell rather than the runner's default bash on
      # purpose. Under `shell: bash` on windows-arm64 the PATH finds an x86-64
      # objdump from the runner image, which cannot read an aarch64 PE and says
      # "file format not recognized" -- and an earlier version of this step then
      # reported that as a DLL dependency, which is a dead instrument being read
      # as a finding.
      - name: the binary must be self-contained (windows)
        if: matrix.msys2
        shell: msys2 {0}
        run: |
          set -e
          eg=$(find build -name 'ElmerGrid.exe' | head -1)
          [ -n "$eg" ] || { echo "::error::ElmerGrid was not built"; exit 1; }
          echo "binary: $eg  ($(wc -c < "$eg") bytes)"

          if ! raw=$(objdump -p "$eg" 2>&1); then
            echo "$raw"
            echo "::error::objdump could not read the binary, so this check did not run"
            exit 1
          fi
          out=$(echo "$raw" | grep -i 'DLL Name' || true)
          echo "$out"

          # Every Windows PE imports at least one system DLL. No import lines at
          # all means objdump produced nothing useful, not that the binary is
          # gloriously free of dependencies.
          if [ -z "$out" ]; then
            echo "::error::objdump listed no imports at all, so this check did not run"
            exit 1
          fi
          if echo "$out" | grep -viE 'KERNEL32|msvcrt|ucrtbase|api-ms-win|ADVAPI32|USER32|SHELL32|ntdll'; then
            echo "::error::the binary depends on a DLL that is not part of Windows"
            exit 1
          fi
          echo "ok: only system DLLs"

      - name: it must actually mesh something
        shell: bash
        run: |
          set -e
          eg=$(find build -name 'ElmerGrid' -o -name 'ElmerGrid.exe' | head -1)
          eg=$(cd "$(dirname "$eg")" && pwd)/$(basename "$eg")
          cd tests/serial
          "$eg" 1 2 rect.grd -out "$RUNNER_TEMP/smoke" > /dev/null
          for f in mesh.header mesh.nodes mesh.elements mesh.boundary; do
            [ -s "$RUNNER_TEMP/smoke/$f" ] || { echo "::error::no $f"; exit 1; }
          done
          echo "smoke test: $(head -1 "$RUNNER_TEMP/smoke/mesh.header")"

      - name: package
        shell: bash
        run: |
          set -e
          d="dist/elmergrid-${{ matrix.target }}"
          mkdir -p "$d"
          eg=$(find build -name 'ElmerGrid' -o -name 'ElmerGrid.exe' | head -1)
          cp "$eg" "$d/"
          cp README.md LICENSES GPL-2 "$d/" 2>/dev/null || true
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "elmergrid-${{ matrix.target }}.zip" "elmergrid-${{ matrix.target }}" > /dev/null
          else
            tar czf "elmergrid-${{ matrix.target }}.tar.gz" "elmergrid-${{ matrix.target }}"
          fi
          ls -l .

      - uses: actions/upload-artifact@v4
        with:
          name: elmergrid-${{ matrix.target }}
          path: dist/elmergrid-*.*
          if-no-files-found: error

  publish:
    needs: build
    # A platform that fails does not withhold the platforms that worked.
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: list what will be published
        run: ls -lR dist

      - name: attach to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: dist/**/elmergrid-*.*
